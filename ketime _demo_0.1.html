<style>

}

.node-extras{width:168px;margin-top:7px;border-left:2px solid #d4cfc5;padding-left:10px}.checklist-header{display:flex;gap:5px;align-items:center;color:var(--text-2);font-size:.72rem;font-weight:650;padding:2px 0 5px;cursor:pointer}.node-manual-warning{margin:-1px 0 6px;padding:4px 6px;border-radius:5px;background:#fff4df;color:#9a6325;font-size:.61rem;line-height:1.35}.checklist-collapsed .checklist-items,.checklist-collapsed .add-task{display:none}.checklist-collapsed .collapse-arrow{transform:rotate(-90deg)}.collapse-arrow{display:inline-block;transition:.15s}.checklist-items{display:flex;flex-direction:column;gap:5px}.task-row{display:grid;grid-template-columns:20px minmax(0,1fr) 22px;align-items:center;gap:5px;padding:3px 0}.task-toggle{width:18px;height:18px;border:2px solid #bdb8ae;background:#fff;border-radius:50%;color:transparent;font-size:.65rem;display:grid;place-items:center}.task-toggle.done{background:var(--primary);border-color:var(--primary);color:#fff}.task-toggle:disabled{opacity:.38;cursor:not-allowed}.task-main{min-width:0}.task-name{width:100%;border:0;background:transparent;font-size:.72rem;color:var(--text);padding:1px 0}.task-row.done .task-name{text-decoration:line-through;color:var(--muted)}.task-meta{font-size:.61rem;color:var(--primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.task-meta.ongoing{color:var(--warning)}.task-edit{width:20px;height:20px;border:0;background:transparent;color:var(--muted);border-radius:5px}.task-edit:hover{background:var(--primary-soft);color:var(--primary)}.task-delete{grid-column:3;width:20px;height:20px;border:0;background:transparent;color:var(--muted);font-size:.85rem}.task-delete:hover{color:var(--danger)}.add-task{border:0;background:transparent;color:var(--primary);font-size:.7rem;padding:5px 2px;margin-top:2px}.add-task:hover{text-decoration:underline}
.empty-state{display:none;text-align:center;padding:80px 20px;color:var(--muted)}.empty-state.visible{display:block}.empty-state-icon{font-size:2rem;margin-bottom:10px}.empty-state h3{color:var(--text-2);font-size:1rem;margin-bottom:5px}

inter-events:stroke;cursor:crosshair}.growth-point{stroke:#fff;stroke-width:2;cursor:pointer}.growth-point:focus{outline:none;stroke:var(--text);stroke-width:3}.growth-tooltip{display:none;position:absolute;z-index:10;max-width:240px;transform:translate(10px,-115%);background:#2d2b27;color:#fff;border-radius:7px;padding:7px 9px;font-size:.72rem;line-height:1.45;box-shadow:0 4px 15px rgba(0,0,0,.18);pointer-events:none;white-space:nowrap}.growth-tooltip.visible{display:block}.growth-empty{display:none;position:absolute;inset:0;align-items:center;justify-content:center;flex-direction:column;gap:7px;color:var(--muted);font-size:.8rem;background:rgba(255,255,255,.72)}.growth-empty.visible{display:flex}.growth-empty strong{color:var(--text-2);font-size:.95rem}

.color-presets{display:flex;flex-wrap:wrap;gap:7px}.color-preset{width:29px;height:29px;border-radius:50%;border:2px solid transparent}.color-preset.selected{border-color:var(--text);box-shadow:0 0 0 2px #fff inset}.choice-copy{font-size:.84rem;color:var(--text-2);margin-bottom:18px}.choice-buttons{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}
.link-summary{padding:10px 11px;background:var(--primary-soft);border:1px solid #d3e8da;border-radius:8px;font-size:.74rem;color:var(--primary);margin-bottom:14px}.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,12px);background:#282723;color:#fff;padding:9px 14px;border-radius:8px;font-size:.78rem;z-index:1200;opacity:0;pointer-events:none;transition:.2s}.toast.visible{opacity:1;transform:translate(-50%,0)}
.organize-name{padding:9px 11px;background:var(--surface-soft);border:1px solid var(--border);border-radius:8px;font-size:.82rem;font-weight:650;margin-bottom:15px}.organize-actions{display:grid;gap:8px;margin-bottom:14px}.organize-action{border:1px solid var(--border);background:#fff;border-radius:8px;padding:10px 12px;text-align:left;color:var(--text);font-size:.8rem}.organize-action:hover{border-color:#bfd6c7;background:var(--primary-soft);color:var(--primary)}.organize-project-fields{display:none;padding:12px;background:var(--surface-soft);border-radius:9px;margin-bottom:14px}.organize-project-fields.visible{display:block}

@media(max-width:760px){.app-nav{grid-template-columns:minmax(100px,1fr) auto minmax(100px,1fr);padding:0 12px}.brand-cn{font-size:1.12rem}.view-tab{padding:7px 8px;font-size:.78rem}.schedule-toolbar{padding:0 10px;gap:7px}.date-picker-btn{min-width:155px;font-size:.78rem}.daystart-group span{display:none}.add-event-btn{padding:8px 10px}.add-event-btn .label{display:none}.schedule-grid{grid-template-columns:42px repeat(7,minmax(74px,1fr));min-width:600px}.untimed-panel{flex-basis:170px;min-height:170px}.untimed-head{padding:0 12px}.untimed-scroll{padding:9px 12px 13px}.untimed-list{grid-template-columns:1fr}.project-app,.growth-app{padding:24px 14px 60px}.project-header-main,.growth-header-main{align-items:flex-start;flex-wrap:wrap}.project-title,.growth-title{font-size:2.35rem}.growth-controls{width:100%}.growth-date-label{flex:1}.growth-date-input{width:100%}.project-card{padding:20px 14px}.project-card-head{flex-wrap:wrap}.node-group{width:148px}.form-row,.form-row.three{grid-template-columns:1fr}.modal{padding:22px 18px}.ph-add{width:100%;margin:3px 0 0}}
@media(max-width:480px){.app-nav{grid-template-columns:1fr auto 1fr}.project-title,.growth-title{font-size:1.6rem}.growth-chart-stage{min-width:620px}}
.bupt-modal{width:760px}.bupt-note{font-size:.75rem;color:var(--text-2);margin-bottom:14px;line-height:1.7}.bupt-status{font-size:.8rem;margin:14px 0;min-height:24px;color:var(--primary)}.bupt-status.error{color:var(--danger)}.bupt-course-scroll{max-height:260px;overflow:auto;margin:16px 0;border:1px solid var(--border);border-radius:8px}.bupt-course-table{width:100%;border-collapse:collapse;font-size:.75rem}.bupt-course-table th,.bupt-course-table td{text-align:left;padding:9px;border-bottom:1px solid var(--border);vertical-align:top}.bupt-course-table th{background:var(--surface-soft);position:sticky;top:0}.bupt-backup{margin-top:20px;border-top:1px solid var(--border);padding-top:12px;font-size:.8rem}.bupt-backup summary{cursor:pointer;margin-bottom:10px}.bupt-status~[hidden],#bupt-local-hint[hidden]{display:none}.btn:disabled{opacity:.5;cursor:wait}.event-source{font-size:.6rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bupt-sync-btn{white-space:nowrap;font-size:.78rem}@media(max-width:760px){.schedule-toolbar{height:auto;flex-basis:auto;min-height:58px;flex-wrap:wrap;padding:8px 10px}.bupt-sync-btn{padding:7px}.bupt-course-table{min-width:500px}.bupt-modal{padding:20px 14px}}

<body>
<header class="app-nav">
  <div class="brand"><span class="brand-copy"><span class="brand-cn">刻时</span></span></div>
  <nav class="view-tabs" aria-label="主要页面">
    <button class="view-tab active" data-view="schedule">日程表</button>
    <button class="view-tab" data-view="projects">项目单</button>
    <button class="view-tab" data-view="growth">成长曲线</button>
  </nav>
</header>

<main>
  <section class="view active" id="view-schedule" aria-label="日程表">
    <div class="schedule-toolbar">
      <button class="date-picker-btn" id="date-picker-btn"><span class="calendar-icon">▣</span><span id="week-range-label"></span></button>
      <button class="today-btn" id="today-btn">今天</button>
      <div class="week-nav"><button class="icon-btn" id="prev-week" aria-label="上一周">‹</button><button class="icon-btn" id="next-week" aria-label="下一周">›</button></div>
      <div class="calendar-popup" id="calendar-popup">
        <div class="calendar-head"><button id="cal-prev-month" aria-label="上个月">‹</button><span class="calendar-month" id="cal-month-label"></span><button id="cal-next-month" aria-label="下个月">›</button></div>
        <div class="calendar-weekdays"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
        <div class="calendar-days" id="calendar-days"></div>
      </div>
      <div class="toolbar-spacer"></div>
      <label class="daystart-group"><span>日起始</span><select class="daystart-select" id="daystart-select" aria-label="一天的开始时间"></select></label>
      <button class="btn bupt-sync-btn" id="bupt-sync-btn" type="button">北邮课表</button>
      <button class="add-event-btn" id="add-event-btn"><span>＋</span><span class="label">添加日程</span></button>
    </div>
    <div class="schedule-wrap" id="schedule-wrap"><div class="schedule-grid" id="schedule-grid"></div></div>
    <section class="untimed-panel" aria-labelledby="untimed-title">
      <div class="untimed-head">
        <h2 class="untimed-title" id="untimed-title">待收纳</h2>
        <span class="untimed-count" id="untimed-count">0 项</span>
        <span class="untimed-spacer"></span>
        <button class="untimed-add-btn" id="add-untimed-todo" type="button">＋ 快速记录</button>
      </div>
      <div class="untimed-scroll">
        <div class="untimed-add-row" id="untimed-add-row">
          <span class="untimed-add-mark" aria-hidden="true"></span>
          <input class="untimed-input" id="untimed-input" maxlength="200" autocomplete="off" placeholder="记录尚未整理的事情，按 Enter 保存" aria-label="新待收纳事项名称">
          <span class="untimed-add-hint">Enter</span>
        </div>
        <div class="untimed-list" id="untimed-list" aria-live="polite"></div>
        <div class="untimed-empty" id="untimed-empty">暂时没有待收纳事项。先快速记录，之后再安排进日程或项目。</div>
      </div>
    </section>
  </section>

  <section class="view" id="view-projects" aria-label="项目单">
    <div class="project-app">
      <div class="project-header-main">
        <div class="project-title-wrap"><h1 class="project-title">项目进度追踪</h1></div>
        <button class="btn btn-primary" id="btn-add-project">＋ 新建项目</button>
      </div>
      <p class="project-rule-note">完成度按项目全部待办及空节点里程碑计算；阻塞事项仍计入，无期限重复日程不计入。</p>
      <div class="projects-list" id="projects-list"></div>
      <div class="empty-state" id="empty-state"><div class="empty-state-icon">◎</div><h3>还没有项目</h3><p>新建项目，并用节点与待办细则推进长期目标。</p></div>
    </div>
  </section>

  <section class="view" id="view-growth" aria-label="成长曲线">
    <div class="growth-app">
      <div class="growth-header-main">
        <h1 class="growth-title">成长曲线</h1>
        <div class="growth-controls" aria-label="成长曲线日期范围">
          <label class="growth-date-label" for="growth-start">开始日期<input class="growth-date-input" type="date" id="growth-start"></label>
          <label class="growth-date-label" for="growth-end">结束日期<input class="growth-date-input" type="date" id="growth-end"></label>
        </div>
      </div>
      <div class="growth-card">
        <div class="growth-legend" id="growth-legend"></div>
        <div class="growth-chart-scroll" id="growth-chart-scroll">
          <div class="growth-chart-stage" id="growth-chart-stage">
            <svg class="growth-svg" id="growth-svg" viewBox="0 0 960 430" role="img" aria-label="项目完成度成长曲线"></svg>
            <div class="growth-tooltip" id="growth-tooltip" role="status" aria-live="polite"></div>
            <div class="growth-empty" id="growth-empty"><strong>当前范围没有成长记录</strong><span>调整起止日期，或先在项目单中推进项目。</span></div>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>

<div class="context-menu" id="context-menu">
  <button class="context-menu-item" data-menu-action="checklist">添加待办清单</button>
  <button class="context-menu-item" data-menu-action="cl-toggle" id="menu-toggle-checklist" style="display:none"><span id="menu-toggle-checklist-label">收起待办清单</span></button>
  <div class="context-menu-divider"></div>
  <button class="context-menu-item danger" data-menu-action="fail">标记为阻塞</button>
  <button class="context-menu-item" data-menu-action="reset" id="menu-reset" style="display:none">重置为未完成</button>
</div>
<div class="project-color-popover" id="project-color-popover"></div>

<div class="overlay" id="choice-overlay">
  <div class="modal small"><div class="modal-title">修改日程</div><p class="choice-copy" id="choice-desc"></p><div class="choice-buttons"><button class="btn" id="choice-single">仅修改本次</button><button class="btn btn-primary" id="choice-all">修改全部相关</button><button class="btn" id="choice-cancel">取消</button></div></div>
</div>

<div class="overlay" id="schedule-overlay">
  <div class="modal">
    <div class="modal-title" id="schedule-modal-title">添加日程</div>
    <div class="form-group"><label class="form-label">日程名称</label><div class="form-hint">先把光标放到名称中的任意位置，再插入数字占位符；可在一个名称中插入多个</div><div class="chips-editor" id="chips-editor"></div></div>
    <div class="form-row">
      <div class="form-group"><label class="form-label" for="event-project">关联项目</label><select class="form-select" id="event-project"></select></div>
      <div class="form-group conditional" id="event-node-group"><label class="form-label" for="event-node">关联节点</label><select class="form-select" id="event-node"></select></div>
    </div>
    <div class="link-summary conditional" id="event-link-summary"></div>
    <div class="form-row three">
      <div class="form-group"><label class="form-label" for="event-date">日期</label><input class="form-input" type="date" id="event-date"></div>
      <div class="form-group"><label class="form-label" for="event-start">开始</label><input class="form-input" type="time" id="event-start" step="900"></div>
      <div class="form-group"><label class="form-label" for="event-end">结束</label><input class="form-input" type="time" id="event-end" step="900"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label class="form-label" for="event-repeat">重复</label><select class="form-select" id="event-repeat"><option value="none">不重复</option><option value="daily">每天</option><option value="weekly">每周</option><option value="monthly">每月</option></select></div>
      <div class="form-group"><label class="form-label">状态</label><label class="check-line"><input type="checkbox" id="event-done"> <span id="event-done-copy">已完成（与关联待办同步）</span></label></div>
    </div>
    <div class="form-group conditional" id="event-repeat-options">
      <label class="form-label" for="event-repeat-limit">重复期限与项目完成度</label>
      <div class="form-row">
        <select class="form-select" id="event-repeat-limit"><option value="unbounded">持续进行（不计项目完成度）</option><option value="bounded">设置执行期限（按发生次数计入）</option></select>
        <div class="conditional" id="event-repeat-end-group"><input class="form-input" type="date" id="event-repeat-end" aria-label="重复结束日期"></div>
      </div>
      <div class="form-hint">起始日期使用上方日期；有期限时，每次实际发生均作为一个任务单位。</div>
    </div>
    <div class="form-group"><label class="form-label">颜色</label><div class="color-presets" id="event-color-presets"></div></div>
    <div class="modal-actions"><button class="btn btn-danger left" id="delete-event" style="display:none">删除日程</button><button class="btn" id="cancel-event">取消</button><button class="btn btn-primary" id="save-event">保存</button></div>
  </div>
</div>

<div class="ph-config" id="ph-config">
  <div class="form-row"><div><label class="form-label">从</label><input class="form-input" type="number" id="ph-from" min="1" max="150"></div><div><label class="form-label">至</label><input class="form-input" type="number" id="ph-to" min="1" max="150"></div></div>
  <div class="form-row" style="margin-top:8px"><div><label class="form-label">筛选</label><select class="form-select" id="ph-filter"><option value="all">全部</option><option value="odd">仅奇数</option><option value="even">仅偶数</option></select></div><div><label class="form-label">格式</label><select class="form-select" id="ph-format"><option value="number">123</option><option value="circle">① 带圈</option><option value="paren">(1)</option><option value="cnparen">（一）</option><option value="cn">一二三</option><option value="roman">I II III</option></select></div></div>
  <div class="ph-preview" id="ph-preview"></div><div class="ph-actions"><button class="btn btn-danger" id="ph-delete" style="display:none">删除</button><button class="btn" id="ph-cancel">取消</button><button class="btn btn-primary" id="ph-save">确定</button></div>
</div>

<div class="overlay" id="task-overlay">
  <div class="modal">
    <div class="modal-title" id="task-modal-title">添加待办细则</div>
    <div class="form-group"><label class="form-label" for="task-name">待办名称</label><input class="form-input" id="task-name" placeholder="例如：完成需求清单"></div>
    <div class="form-group"><label class="form-label" for="task-schedule-link">日程关联</label><select class="form-select" id="task-schedule-link"><option value="none">不关联日程</option><option value="linked">关联日程</option></select></div>
    <div class="conditional" id="task-schedule-fields">
      <div class="link-summary" id="task-link-summary"></div>
      <div class="form-row three">
        <div class="form-group"><label class="form-label" for="task-date">日期</label><input class="form-input" type="date" id="task-date"></div>
        <div class="form-group"><label class="form-label" for="task-start">开始</label><input class="form-input" type="time" step="900" id="task-start"></div>
        <div class="form-group"><label class="form-label" for="task-end">结束</label><input class="form-input" type="time" step="900" id="task-end"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label class="form-label" for="task-repeat">重复</label><select class="form-select" id="task-repeat"><option value="none">不重复</option><option value="daily">每天</option><option value="weekly">每周</option><option value="monthly">每月</option></select></div>
        <div class="form-group"><label class="form-label">状态</label><label class="check-line"><input type="checkbox" id="task-done"> <span id="task-done-copy">已完成（与日程同步）</span></label></div>
      </div>
      <div class="form-group conditional" id="task-repeat-options">
        <label class="form-label" for="task-repeat-limit">重复期限与项目完成度</label>
        <div class="form-row">
          <select class="form-select" id="task-repeat-limit"><option value="unbounded">持续进行（不计项目完成度）</option><option value="bounded">设置执行期限（按发生次数计入）</option></select>
          <div class="conditional" id="task-repeat-end-group"><input class="form-input" type="date" id="task-repeat-end" aria-label="重复结束日期"></div>
        </div>
      </div>
      <div class="form-group"><label class="form-label">日程颜色</label><div class="color-presets" id="task-color-presets"></div></div>
    </div>
    <div class="modal-actions"><button class="btn btn-danger left" id="delete-task" style="display:none">删除待办</button><button class="btn" id="cancel-task">取消</button><button class="btn btn-primary" id="save-task">保存</button></div>
  </div>
</div>

<div class="overlay" id="inbox-organize-overlay">
  <div class="modal small">
    <div class="modal-title">收纳事项</div>
    <div class="organize-name" id="organize-name"></div>
    <div class="organize-actions">
      <button class="organize-action" id="organize-to-schedule" type="button">转为一般日程</button>
      <button class="organize-action" id="organize-to-project" type="button">归入项目节点</button>
      <button class="organize-action" id="organize-keep" type="button">保持为临时杂项</button>
    </div>
    <div class="organize-project-fields" id="organize-project-fields">
      <div class="form-group"><label class="form-label" for="organize-project">项目</label><select class="form-select" id="organize-project"></select></div>
      <div class="form-group"><label class="form-label" for="organize-node">节点</label><select class="form-select" id="organize-node"></select></div>
      <button class="btn btn-primary" id="organize-project-confirm" type="button">归入所选节点</button>
    </div>
    <div class="modal-actions"><button class="btn" id="organize-cancel" type="button">取消</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="bupt-import.js"></script>
<script src="bupt-ui.js"></script>
<script>
(function(){
'use strict';
var STATE_KEY='ketime-demo-v0.1';
var COLORS=['#8faac7','#8fbaa5','#c4ad8f','#b89a9a','#9aadb8','#a8b88f','#b8a4c4','#c4b08f','#8fb0b8','#b89a8f','#9aafc4','#c4a48f','#a4b89a','#b8a4b8','#8fbaa8','#adc48f','#c49aad','#8fa8c4','#b8c49a','#ad8fc4'];
var REPEAT_LABEL={none:'不重复',daily:'每天',weekly:'每周',monthly:'每月'};
var DAY_NAMES=['周一','周二','周三','周四','周五','周六','周日'];
var HOUR_HEIGHT=56,state,currentWeekStart=getMonday(new Date()),calendarYear,calendarMonth;

function uid(prefix){return(prefix||'id')+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function pad(n){return String(n).padStart(2,'0')}
function fmtDate(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parseDate(s){return new Date(s+'T12:00:00')}
function addDays(s,n){var d=parseDate(s);d.setDate(d.getDate()+n);return fmtDate(d)}
function diffDays(a,b){return Math.round((parseDate(a)-parseDate(b))/86400000)}
function getMonday(d){var x=new Date(d);x.setHours(12,0,0,0);var day=x.getDay();x.setDate(x.getDate()+(day===0?-6:1-day));return x}

  var tickCount=Math.min(7,totalDays+1),tickIndexes=[];if(totalDays===0)tickIndexes=[0];else for(var ti=0;ti<tickCount;ti++){var idx=Math.round(ti*totalDays/(tickCount-1));if(tickIndexes.indexOf(idx)<0)tickIndexes.push(idx)}tickIndexes.forEach(function(index){var date=addDays(growthRangeStart,index),x=xFor(date);svg.appendChild(makeSvg('line',{x1:x,y1:H-margin.bottom,x2:x,y2:H-margin.bottom+5,class:'growth-axis-line'}));var d=parseDate(date);svg.appendChild(makeSvg('text',{x:x,y:H-margin.bottom+21,'text-anchor':'middle',class:'growth-axis-label'},(d.getMonth()+1)+'/'+d.getDate()))});
  var visible=[];state.growth.series.forEach(function(series){var points=series.points.filter(function(point){return point.date>=growthRangeStart&&point.date<=growthRangeEnd});if(points.length)visible.push({series:series,points:points})});appendGrowthLegend(visible);document.getElementById('growth-empty').classList.toggle('visible',!visible.length);
  visible.forEach(function(item){splitGrowthSegments(item.points).forEach(function(segment){var mapped=segment.map(function(point){return{x:xFor(point.date),y:yFor(point.completion),source:point}});if(mapped.length>1){var d=monotoneGrowthPath(mapped),line=makeSvg('path',{d:d,stroke:item.series.color,class:'growth-line'}),hit=makeSvg('path',{d:d,class:'growth-line-hit'});svg.appendChild(line);svg.appendChild(hit);bindGrowthPathHover(hit,item.series,mapped)}mapped.forEach(function(point){var circle=makeSvg('circle',{cx:point.x,cy:point.y,r:4.5,fill:item.series.color,class:'growth-point',tabindex:'0','aria-label':item.series.name+' '+point.source.date+' '+formatCompletionValue(point.source.completion)});circle.addEventListener('mouseenter',function(){showGrowthTooltipAt(item.series,point.source,point.x,point.y)});circle.addEventListener('mouseleave',hideGrowthTooltip);circle.addEventListener('focus',function(){showGrowthTooltipAt(item.series,point.source,point.x,point.y)});circle.addEventListener('blur',hideGrowthTooltip);circle.addEventListener('pointerdown',function(e){e.stopPropagation();showGrowthTooltipAt(item.series,point.source,point.x,point.y)});svg.appendChild(circle)})})})
}

function addProject(){state.projects.push({id:uid('project'),name:'新项目',color:randomColor(),nodes:[{id:uid('node'),name:'步骤 1',done:false,failed:false,clCollapsed:false,checklist:[]}]});saveState();renderProjects()}

function toggleNode(pi,ni){var n=state.projects[pi]&&state.projects[pi].nodes[ni];if(!n)return;if(n.failed){n.failed=false;saveState();renderProjects();return}if(n.done){n.done=false;saveState();renderProjects();if(nodeTasksAllDone(n))showToast('待办已全部完成，节点仍视为完成');return}if(n.checklist.length&&nodeHasIncompleteTodos(n)){if(!confirm('仍有未完成待办。确定将节点独立标记为完成吗？待办完成状态不会改变。'))return;n.done=true;saveState();renderProjects();showToast('节点已独立标记完成，待办状态保持不变');return}if(n.checklist.length){showToast('待办已全部完成，节点已自动完成');return}n.done=true;saveState();renderProjects()}

function toggleTask(pi,ni,ci){var t=state.projects[pi]&&state.projects[pi].nodes[ni]&&state.projects[pi].nodes[ni].checklist[ci];if(!t)return;var ev=t.scheduleId?getEvent(t.scheduleId):null;if(ev&&ev.repeat!=='none'){var occurrenceDate=occurrenceIdentityForActualDate(ev,todayStr());if(!occurrenceDate){showToast('今天没有这项日程，请在对应日期记录');return}var occurrence=effectiveOccurrence(ev,occurrenceDate);setOccurrenceDone(ev,occurrenceDate,!occurrence.done);syncTaskFromEvent(ev)}else{t.done=!t.done;syncEventFromTask(t)}saveState();renderProjects();renderSchedule();showToast(ev&&ev.repeat!=='none'?'今天的完成状态已同步':'完成状态已双向同步')}
function deleteTaskRecord(pi,ni,ci){var n=state.projects[pi]&&state.projects[pi].nodes[ni],t=n&&n.checklist[ci];if(!t)return;if(!confirm('确定删除待办“'+t.name+'”吗？关联日程会保留并解除关联。'))return;var ev=t.scheduleId?getEvent(t.scheduleId):null;if(ev)detachEvent(ev);n.checklist.splice(ci,1);saveState();renderProjects();renderSchedule();showToast('待办已删除，关联日程已保留')}

/* Task modal */

function openTaskModal(pi,ni,ci){
  var p=state.projects[pi],n=p&&p.nodes[ni];if(!n)return;taskEdit={pi:pi,ni:ni,ci:typeof ci==='number'?ci:null};var task=typeof ci==='number'?n.checklist[ci]:null,ev=task&&task.scheduleId?getEvent(task.scheduleId):null;
  document.getElementById('task-modal-title').textContent=task?'编辑待办细则':'添加待办细则';document.getElementById('task-name').value=task?task.name:'待办项';document.getElementById('task-schedule-link').value=ev?'linked':'none';document.getElementById('task-date').value=ev?ev.date:todayStr();document.getElementById('task-start').value=ev?ev.start:'09:00';document.getElementById('task-end').value=ev?ev.end:'10:00';document.getElementById('task-repeat').value=ev?ev.repeat:'none';document.getElementById('task-repeat-limit').value=ev&&ev.endDate?'bounded':'unbounded';document.getElementById('task-repeat-end').value=ev&&ev.endDate?ev.endDate:'';document.getElementById('task-done').checked=task?task.done:false;selectedTaskColor=ev?ev.color:(p.color||randomColor());renderColorPresets('task-color-presets',selectedTaskColor,function(c){selectedTaskColor=c});document.getElementById('task-link-summary').textContent='关联后会在日程表中创建日程，并与“'+p.name+' · '+n.name+'”中的待办共享名称和完成状态。';document.getElementById('delete-task').style.display=task?'':'none';updateTaskScheduleFields();document.getElementById('task-overlay').classList.add('visible')
}

function updateTaskRepeatFields(){var linked=document.getElementById('task-schedule-link').value==='linked',repeat=document.getElementById('task-repeat').value,hasRepeat=linked&&repeat!=='none',bounded=hasRepeat&&document.getElementById('task-repeat-limit').value==='bounded',date=document.getElementById('task-date').value||todayStr(),end=document.getElementById('task-repeat-end'),done=document.getElementById('task-done');document.getElementById('task-repeat-options').classList.toggle('visible',hasRepeat);document.getElementById('task-repeat-end-group').classList.toggle('visible',bounded);end.min=date;if(bounded&&!end.value)end.value=addDays(date,30);done.disabled=hasRepeat;document.getElementById('task-done-copy').textContent=hasRepeat?'请在当日日程中记录完成状态':'已完成（与日程同步）'}
function closeTaskModal(){document.getElementById('task-overlay').classList.remove('visible');taskEdit={pi:null,ni:null,ci:null}}
function saveTaskForm(){
  var p=state.projects[taskEdit.pi],n=p&&p.nodes[taskEdit.ni];if(!n)return;var name=document.getElementById('task-name').value.trim();if(!name){showToast('请输入待办名称');return}var linked=document.getElementById('task-schedule-link').value==='linked',date=document.getElementById('task-date').value,start=document.getElementById('task-start').value,end=document.getElementById('task-end').value,repeat=document.getElementById('task-repeat').value,endDate=repeat!=='none'&&document.getElementById('task-repeat-limit').value==='bounded'?document.getElementById('task-repeat-end').value:null;if(linked&&(!date||!start||!end)){showToast('请补充日程日期和时间');return}if(linked&&repeat!=='none'&&endDate&&endDate<date){showToast('重复结束日期不能早于开始日期');return}var task=typeof taskEdit.ci==='number'?n.checklist[taskEdit.ci]:null;if(!task){task={id:uid('task'),name:name,done:false,scheduleId:null};n.checklist.push(task);taskEdit.ci=n.checklist.length-1}task.name=name;
  if(linked){
    var checked=document.getElementById('task-done').checked,ev=task.scheduleId?getEvent(task.scheduleId):null,wasRepeat=ev&&ev.repeat!=='none',wasDone=task.done;if(!ev){ev=normalizeEvent({id:uid('event'),name:name,date:date,start:start,end:end,repeat:repeat,endDate:endDate,color:selectedTaskColor,done:checked,projectId:p.id,nodeId:n.id,taskId:task.id});state.schedules.push(ev);task.scheduleId=ev.id}else{ev.name=name;ev.date=date;ev.start=start;ev.end=end;ev.repeat=repeat;ev.endDate=repeat==='none'?null:endDate;ev.color=selectedTaskColor;ev.projectId=p.id;ev.nodeId=n.id;ev.taskId=task.id;if(repeat==='none'){ev.done=checked;ev.occurrenceStates=[]}else{ev.done=false;if(!wasRepeat&&wasDone)setOccurrenceDone(ev,date,true);ev.occurrenceStates=ev.occurrenceStates.filter(function(item){return rawRepeatsOn(ev,item.date)})}}syncTaskFromEvent(ev)
  }else{var old=task.scheduleId?getEvent(task.scheduleId):null;if(old)detachEvent(old);task.scheduleId=null;task.done=document.getElementById('task-done').checked}
  n.clCollapsed=false;saveState();renderProjects();renderSchedule();closeTaskModal();showToast('待办与日程信息已同步')
}
