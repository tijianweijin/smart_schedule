<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>项目进度追踪</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:             #f9f8f6;
  --card-bg:        #ffffff;
  --card-border:    #e8e4dd;
  --card-shadow:    0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.03);
  --track:          #e4dfd6;
  --track-done:     #28794b;
  --node-bg:        #ffffff;
  --node-border:    #c4bfb6;
  --node-border-hover: #8c8880;
  --node-done-bg:   #28794b;
  --node-done-border:#1f623c;
  --node-fail-bg:   #d94a4a;
  --node-fail-border:#b83a3a;
  --text:           #1f1e1c;
  --text-muted:     #8c8880;
  --text-label:     #5c5850;
  --primary:        #28794b;
  --primary-hover:  #1f623c;
  --primary-light:  #e8f5ec;
  --delete:         #d94a4a;
  --delete-hover:   #c03939;
  --badge-bg:       #f2efe9;
  --badge-text:     #8c8880;
  --badge-done-bg:  #e8f5ec;
  --badge-done-text:#28794b;
  --glow-done:      0 0 0 1px rgba(40,121,75,0.18), 0 2px 12px rgba(40,121,75,0.06);
  --label-border:   #e8e4dd;
  --cl-line:        #d4cfc5;
  --radius-sm:      6px;
  --radius-md:      10px;
  --radius-full:    50%;
  --font-body:      -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
  --font-display:   "Songti SC", "Noto Serif SC", "STSong", Georgia, "Times New Roman", serif;
  --transition:     0.2s cubic-bezier(0.4, 0, 0.2, 1);
}

html { font-size: 16px; }

body {
  font-family: var(--font-body); background: var(--bg); color: var(--text);
  min-height: 100vh; line-height: 1.5; -webkit-font-smoothing: antialiased;
}

.app { max-width: 920px; margin: 0 auto; padding: 44px 24px 80px; }

.header {
  display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 16px; margin-bottom: 40px;
  padding-bottom: 22px; border-bottom: 1px solid var(--card-border);
}
.header-title-group { display: flex; align-items: baseline; gap: 12px; }
.header-title {
  font-family: var(--font-display); font-size: 2rem; font-weight: 600;
  color: var(--text); letter-spacing: 0.02em;
}
.header-subtitle {
  font-size: 0.8rem; color: var(--text-muted); font-weight: 400;
  text-transform: uppercase; letter-spacing: 0.08em;
}

.btn {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--font-body); font-size: 0.875rem; font-weight: 500;
  padding: 10px 18px; border-radius: var(--radius-sm); border: none;
  cursor: pointer; transition: background var(--transition), transform var(--transition);
  white-space: nowrap;
}
.btn:active { transform: scale(0.97); }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-hover); }

.btn-icon {
  width: 32px; height: 32px; padding: 0;
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: var(--radius-full); background: transparent;
  border: 1.5px solid transparent; color: var(--text-muted);
  cursor: pointer; flex-shrink: 0;
  transition: color var(--transition), border-color var(--transition), background var(--transition);
}
.btn-icon:hover { color: var(--text); border-color: var(--node-border); background: var(--badge-bg); }
.btn-icon--danger:hover { color: var(--delete); border-color: rgba(217,74,74,0.35); background: rgba(217,74,74,0.05); }
.btn-icon svg { width: 14px; height: 14px; pointer-events: none; }

.projects-list { display: flex; flex-direction: column; gap: 20px; }
.project-card {
  background: var(--card-bg); border: 1px solid var(--card-border);
  border-left: 4px solid #c4bfb6;
  border-radius: var(--radius-md); box-shadow: var(--card-shadow);
  padding: 28px 32px;
  transition: border-color var(--transition), box-shadow var(--transition);
}
.project-card.done {
  border-color: rgba(40,121,75,0.25);
  box-shadow: var(--glow-done);
}

.project-header {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 28px; flex-wrap: wrap;
}
.project-name-input {
  flex: 1; min-width: 160px;
  font-family: var(--font-body); font-size: 1.15rem; font-weight: 600;
  color: var(--text); background: transparent; border: none;
  border-bottom: 2px solid var(--label-border); padding: 4px 2px; outline: none;
  transition: border-color var(--transition);
}
.project-name-input:hover { border-bottom-color: var(--node-border); }
.project-name-input:focus { border-bottom-color: var(--primary); }

.project-badge {
  font-size: 0.8rem; font-weight: 500; padding: 5px 12px;
  border-radius: 20px; background: var(--badge-bg); color: var(--badge-text);
  white-space: nowrap; transition: background var(--transition), color var(--transition);
}
.project-badge.done { background: var(--badge-done-bg); color: var(--badge-done-text); }

/* Completion percentage */
.project-completion-wrap { display: flex; align-items: center; gap: 6px; }
.project-completion-text { font-size: 0.8rem; font-weight: 600; color: var(--primary); white-space: nowrap; }
.project-completion-bar {
  width: 70px; height: 5px; background: var(--track); border-radius: 3px; overflow: hidden;
}
.project-completion-fill {
  height: 100%; background: var(--primary); border-radius: 3px;
  transition: width 0.35s ease;
}
.project-completion-bar.done .project-completion-fill { background: var(--badge-done-text); }

/* Color swatch */
.project-color-swatch {
  width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0;
  border: 2px solid var(--border); cursor: pointer; position: relative;
  transition: border-color var(--transition);
}
.project-color-swatch:hover { border-color: var(--text-secondary); }

/* Color popover */
.project-color-popover {
  display: none; position: fixed; z-index: 700; background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--radius-md);
  box-shadow: var(--shadow-lg); padding: 12px; gap: 6px;
  flex-wrap: wrap; width: 210px;
}
.project-color-popover.visible { display: flex !important; }
.project-color-popover .pr-color-dot {
  width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent;
  cursor: pointer; transition: all var(--transition);
}
.project-color-popover .pr-color-dot:hover { transform: scale(1.15); }
.project-color-popover .pr-color-dot.selected { border-color: var(--text); }

/* ===== Timeline ===== */
.timeline { padding-bottom: 10px; }
.timeline-row {
  display: flex; align-items: flex-start;
  overflow-x: auto; padding: 0; scroll-behavior: smooth;
}
.timeline-row::-webkit-scrollbar { height: 4px; }
.timeline-row::-webkit-scrollbar-track { background: transparent; }
.timeline-row::-webkit-scrollbar-thumb { background: var(--track); border-radius: 4px; }
.timeline-row::-webkit-scrollbar-thumb:hover { background: var(--node-border); }

/* ===== Node Group ===== */
.node-group {
  flex: 1 0 120px; min-width: 100px;
  position: relative;
  display: flex; flex-direction: column; align-items: center;
  padding-bottom: 4px;
}
.node-group .connector {
  position: absolute;
  top: 23px; height: 3px; margin-top: -1.5px;
  background: var(--track); border-radius: 2px;
  transition: background 0.35s ease;
  left: 0; right: 0;
}
.node-group--first .connector { left: 50%; }
.node-group--last  .connector { right: 50%; }
.node-group .connector.done { background: var(--track-done); }

.node-hitarea {
  position: relative; z-index: 1;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
}

.node-circle {
  position: relative;
  width: 46px; height: 46px; border-radius: var(--radius-full);
  background: var(--node-bg); border: 3px solid var(--node-border);
  cursor: pointer; flex-shrink: 0;
  transition: background var(--transition), border-color var(--transition), transform var(--transition), box-shadow var(--transition);
}
.node-circle:hover { transform: scale(1.08); border-color: var(--node-border-hover); }
.node-circle:active { transform: scale(0.95); }
.node-circle.done   { background: var(--node-done-bg); border-color: var(--node-done-border); }
.node-circle.failed { background: var(--node-fail-bg); border-color: var(--node-fail-border); }
.node-circle.done:hover   { border-color: var(--track-done); box-shadow: 0 0 0 4px rgba(40,121,75,0.10); }
.node-circle.failed:hover { border-color: var(--delete);     box-shadow: 0 0 0 4px rgba(217,74,74,0.10); }

/* Icons — absolute centered on circle */
.node-icon {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 22px; height: 22px; opacity: 0;
  transition: opacity 0.2s ease, transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  pointer-events: none;
}
.node-icon--check { transform: translate(-50%, -50%) scale(0.4); }
.node-icon--cross { transform: translate(-50%, -50%) scale(0.4); }
.node-circle.done   .node-icon--check { opacity: 1; transform: translate(-50%, -50%) scale(1); }
.node-circle.failed .node-icon--cross { opacity: 1; transform: translate(-50%, -50%) scale(1); }
.node-icon svg { display: block; width: 100%; height: 100%; }

.node-label-input {
  font-family: var(--font-body); font-size: 0.8rem; color: var(--text-label);
  background: transparent; border: none; border-bottom: 2px solid var(--label-border);
  padding: 3px 6px; text-align: center; outline: none; width: 90px;
  transition: color var(--transition), border-color var(--transition);
}
.node-label-input:hover { color: var(--text); border-bottom-color: var(--node-border); }
.node-label-input:focus { color: var(--text); border-bottom-color: var(--primary); }
.node-circle.done ~ .node-label-input   { color: var(--track-done); border-bottom-color: rgba(40,121,75,0.3); }
.node-circle.failed ~ .node-label-input { color: var(--delete);     border-bottom-color: rgba(217,74,74,0.3); }

.node-delete-btn {
  position: absolute; top: -7px; right: -7px;
  width: 20px; height: 20px; border-radius: var(--radius-full);
  background: var(--card-bg); border: 1px solid var(--card-border);
  color: var(--text-muted); font-size: 12px; line-height: 1;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  opacity: 0; transform: scale(0.7); z-index: 3; padding: 0;
  transition: opacity var(--transition), transform var(--transition), color var(--transition), border-color var(--transition);
}
.node-hitarea:hover .node-delete-btn,
.node-delete-btn:focus-visible { opacity: 1; transform: scale(1); }
.node-delete-btn:hover {
  color: var(--delete); border-color: rgba(217,74,74,0.5); background: rgba(217,74,74,0.06);
}

.add-node-btn {
  flex-shrink: 0;
  width: 36px; height: 36px; border-radius: var(--radius-full);
  background: transparent; border: 2px dashed var(--node-border);
  color: var(--text-muted); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  margin: 5px 0 0 12px;
  transition: border-color var(--transition), color var(--transition), background var(--transition);
}
.add-node-btn:hover {
  border-color: var(--primary); color: var(--primary); background: var(--primary-light);
}
.add-node-btn svg { width: 16px; height: 16px; pointer-events: none; }

/* ===== Context Menu ===== */
.context-menu {
  display: none; position: fixed; z-index: 1000;
  min-width: 190px; background: #fff;
  border: 1px solid var(--card-border); border-radius: var(--radius-sm);
  box-shadow: 0 8px 30px rgba(0,0,0,0.12), 0 2px 8px rgba(0,0,0,0.06);
  padding: 6px 0; overflow: hidden;
}
.context-menu.visible { display: block; }
.context-menu-item {
  display: flex; align-items: center; gap: 10px;
  width: 100%; padding: 10px 16px;
  font-family: var(--font-body); font-size: 0.875rem; color: var(--text);
  background: transparent; border: none; cursor: pointer;
  transition: background var(--transition); text-align: left;
}
.context-menu-item:hover { background: var(--bg); }
.context-menu-item .menu-icon { width: 18px; height: 18px; flex-shrink: 0; }
.context-menu-item .menu-icon svg { width: 100%; height: 100%; }
.context-menu-divider { height: 1px; background: var(--card-border); margin: 4px 0; }

/* ===== Checklist below node ===== */
.node-extras {
  width: 100%;
  display: flex; flex-direction: column;
  margin-top: 2px;
  border-left: 2px solid var(--cl-line);
  padding-left: 12px;
}

.checklist-header {
  display: flex; align-items: center; gap: 6px;
  font-size: 0.78rem; font-weight: 500;
  color: var(--text-label);
  padding: 2px 0 4px;
  cursor: pointer;
}
.checklist-collapse-icon {
  font-size: 0.7rem; color: var(--text-muted);
  transition: transform 0.2s ease; display: inline-block;
}
.checklist-collapsed .checklist-collapse-icon { transform: rotate(-90deg); }
.checklist-collapsed .checklist-items,
.checklist-collapsed .checklist-add-btn { display: none; }

.checklist-items { display: flex; flex-direction: column; gap: 2px; }

.checklist-item { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
.checklist-circle {
  width: 20px; height: 20px; border-radius: var(--radius-full);
  background: var(--node-bg); border: 2px solid var(--node-border);
  cursor: pointer; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: background var(--transition), border-color var(--transition);
}
.checklist-circle:hover { border-color: var(--primary); }
.checklist-circle.done { background: var(--primary); border-color: var(--primary-hover); }
.checklist-circle .cl-check {
  width: 11px; height: 11px; opacity: 0; transition: opacity 0.15s ease;
  display: flex; align-items: center; justify-content: center;
}
.checklist-circle.done .cl-check { opacity: 1; }
.checklist-circle .cl-check svg { display: block; }

.checklist-item-input {
  font-family: var(--font-body); font-size: 0.8rem; color: var(--text-label);
  background: transparent; border: none; border-bottom: 1.5px solid transparent;
  padding: 2px 4px; outline: none; width: 150px;
  transition: border-color var(--transition);
}
.checklist-item-input:focus { border-bottom-color: var(--primary); }
.checklist-item.done .checklist-item-input { text-decoration: line-through; color: var(--text-muted); }

.checklist-add-btn {
  font-size: 0.75rem; color: var(--primary); background: none; border: none;
  cursor: pointer; padding: 4px 8px; border-radius: var(--radius-sm); margin-top: 2px;
  transition: background var(--transition); align-self: flex-start;
}
.checklist-add-btn:hover { background: var(--primary-light); }

/* ===== Empty ===== */
.timeline-empty {
  display: flex; align-items: center; gap: 12px;
  color: var(--text-muted); font-size: 0.85rem; padding: 8px 0;
}
.empty-state {
  display: none; flex-direction: column; align-items: center; justify-content: center;
  padding: 72px 24px; text-align: center;
}
.empty-state.visible { display: flex; }
.empty-state-icon { width: 200px; height: 80px; margin-bottom: 24px; color: var(--track); }
.empty-state-title {
  font-family: var(--font-display); font-size: 1.4rem;
  color: var(--text-muted); margin-bottom: 8px; font-weight: 600;
}
.empty-state-desc { font-size: 0.9rem; color: var(--text-muted); line-height: 1.7; }

@keyframes cardIn {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}
.project-card { animation: cardIn 0.35s ease both; }

:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 2px; }
.node-circle:focus-visible { outline-offset: 3px; border-radius: var(--radius-full); }

@media (max-width: 640px) {
  .app { padding: 24px 16px 60px; }
  .header { flex-direction: column; align-items: flex-start; }
  .header-title { font-size: 1.5rem; }
  .project-card { padding: 20px 16px; }
  .project-header { gap: 8px; margin-bottom: 20px; }
  .project-name-input { font-size: 1rem; }
  .node-group { flex: 1 0 90px; min-width: 80px; }
  .node-circle { width: 40px; height: 40px; border-width: 2.5px; }
  .node-label-input { width: 72px; font-size: 0.72rem; }
  .node-icon { width: 17px; height: 17px; }
  .node-extras { padding-left: 8px; }
  .checklist-item-input { width: 110px; }
  .node-group .connector { top: 20px; }
}
</style>
</head>
<body>

<div class="app">
  <header class="header">
    <div class="header-title-group">
      <h1 class="header-title">项目进度追踪</h1>
      <span class="header-subtitle">milestone tracker</span>
    </div>
    <button class="btn btn-primary" id="btn-add-project" aria-label="新建项目">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      新建项目
    </button>
  </header>

  <div class="projects-list" id="projects-list"></div>

  <div class="empty-state" id="empty-state">
    <svg class="empty-state-icon" viewBox="0 0 200 80" fill="none"><line x1="20" y1="40" x2="180" y2="40" stroke="currentColor" stroke-width="2" stroke-dasharray="6 4" opacity="0.7"/><circle cx="50" cy="40" r="8" stroke="currentColor" stroke-width="2" opacity="0.7"/><circle cx="100" cy="40" r="8" stroke="currentColor" stroke-width="2" opacity="0.7"/><circle cx="150" cy="40" r="8" stroke="currentColor" stroke-width="2" opacity="0.7"/><circle cx="100" cy="40" r="5" fill="currentColor" opacity="0.5"/></svg>
    <h2 class="empty-state-title">准备开始</h2>
    <p class="empty-state-desc">点击「新建项目」添加你的第一个项目，<br>用节点追踪每一个里程碑。</p>
  </div>
</div>

<!-- Context Menu -->
<div class="context-menu" id="context-menu">
  <button class="context-menu-item" data-menu-action="checklist">
    <span class="menu-icon"><svg viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="2"/><path d="M8 12l2 2 4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    添加待办清单
  </button>
  <button class="context-menu-item" data-menu-action="cl-toggle-visibility" id="menu-toggle-checklist" style="display:none;">
    <span class="menu-icon"><svg viewBox="0 0 24 24" fill="none"><path d="M5 9l7 7 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    <span id="menu-toggle-checklist-label">收起待办清单</span>
  </button>
  <hr class="context-menu-divider">
  <button class="context-menu-item" data-menu-action="fail">
    <span class="menu-icon" style="color:var(--delete)"><svg viewBox="0 0 24 24" fill="none"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg></span>
    标记为阻塞
  </button>
  <button class="context-menu-item" data-menu-action="reset-state">
    <span class="menu-icon"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/></svg></span>
    重置为未完成
  </button>
</div>

<!-- Project Color Popover -->
<div class="project-color-popover" id="project-color-popover"></div>

<script>
(function() {
  'use strict';

  var COLORS=['#8faac7','#8fbaa5','#c4ad8f','#b89a9a','#9aadb8','#a8b88f','#b8a4c4','#c4b08f','#8fb0b8','#b89a8f','#9aafc4','#c4a48f','#a4b89a','#b8a4b8','#8fbaa8','#adc48f','#c49aad','#8fa8c4','#b8c49a','#ad8fc4'];
  var STORAGE_KEY='project-tracker-data-v5';

  var projects=[],ctxTarget=null,prColorTarget=null;

  function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(projects))}catch(e){}}
  function load(){
    try{
      var raw=localStorage.getItem(STORAGE_KEY)||localStorage.getItem('project-tracker-data-v4')||localStorage.getItem('project-tracker-data-v3')||localStorage.getItem('project-tracker-data-v2');
      if(raw){var p=JSON.parse(raw);if(Array.isArray(p)){projects=p.map(np);if(projects.length>0)return}}
    }catch(e){}
    projects=[{name:'示例项目',color:null,nodes:[{name:'需求分析',done:true,failed:false,checklist:[],clCollapsed:false},{name:'原型设计',done:true,failed:false,checklist:[],clCollapsed:false},{name:'开发实现',done:false,failed:false,checklist:[],clCollapsed:false},{name:'测试验收',done:false,failed:false,checklist:[],clCollapsed:false},{name:'上线部署',done:false,failed:false,checklist:[],clCollapsed:false}]}];
  }

  function np(p){return{name:String(p.name||'新项目'),color:p.color||null,nodes:Array.isArray(p.nodes)?p.nodes.map(function(n){return{name:String(n.name||''),done:Boolean(n.done),failed:Boolean(n.failed),clCollapsed:Boolean(n.clCollapsed),checklist:Array.isArray(n.checklist)?n.checklist.map(function(c){return{name:String(c.name||''),done:Boolean(c.done)}}):[]}}):[]}}

  // Completion: sum of (checklist.length || 1) for done items / sum of (checklist.length || 1) for all items, rounded to 1 decimal
  function calcCompletion(project){
    var totalItems=0,doneItems=0;
    project.nodes.forEach(function(n){
      if(n.failed)return;
      var weight=n.checklist.length>0?n.checklist.length:1;
      totalItems+=weight;
      if(n.done)doneItems+=weight;
      else doneItems+=n.checklist.filter(function(c){return c.done}).length;
    });
    if(totalItems===0)return 0;
    return Math.round(doneItems/totalItems*1000)/10;
  }

  var projectsList=document.getElementById('projects-list'),emptyState=document.getElementById('empty-state');
  var btnAddProject=document.getElementById('btn-add-project'),ctxMenu=document.getElementById('context-menu');
  var menuToggleCL=document.getElementById('menu-toggle-checklist'),menuToggleCLLabel=document.getElementById('menu-toggle-checklist-label');
  var prColorPopover=document.getElementById('project-color-popover');

  var ICON_CHECK='<svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var ICON_CROSS='<svg viewBox="0 0 24 24" fill="none"><path d="M18 6L6 18M6 6l12 12" stroke="white" stroke-width="2.5" stroke-linecap="round"/></svg>';
  var ICON_PLUS='<svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
  var ICON_TRASH='<svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M10 11v6M14 11v6M5 7l1 12a2 2 0 002 2h8a2 2 0 002-2l1-12M9 7V4h6v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function rndC(){return COLORS[Math.floor(Math.random()*COLORS.length)]}

  function render(){
    projectsList.innerHTML='';
    if(projects.length===0){emptyState.classList.add('visible');return}
    emptyState.classList.remove('visible');

    projects.forEach(function(project,pi){
      var completion=calcCompletion(project);
      var allNodesDone=project.nodes.length>0&&project.nodes.every(function(n){return!n.failed&&n.done});
      var cardColor=project.color||'#c4bfb6';

      var card=document.createElement('div');
      card.className='project-card'+(allNodesDone?' done':'');
      card.style.borderLeftColor=cardColor;

      var header=document.createElement('div');
      header.className='project-header';

      // Color swatch
      var swatch=document.createElement('span');
      swatch.className='project-color-swatch';
      swatch.style.background=cardColor;
      swatch.title='更改项目颜色';
      swatch.addEventListener('click',function(e){e.stopPropagation();e.preventDefault();openPrColorPicker(pi,swatch)});
      swatch.addEventListener('mousedown',function(e){e.stopPropagation();e.preventDefault();openPrColorPicker(pi,swatch)});

      var nameInput=document.createElement('input');
      nameInput.type='text';nameInput.className='project-name-input';
      nameInput.value=project.name;nameInput.placeholder='项目名称';
      nameInput.dataset.action='rename-project';nameInput.dataset.pi=pi;

      // Badge
      var badge=document.createElement('span');
      badge.className='project-badge'+(allNodesDone?' done':'');
      badge.textContent=allNodesDone?'✓ 已完成':project.nodes.filter(function(n){return n.done&&!n.failed}).length+'/'+project.nodes.filter(function(n){return!n.failed}).length+' 节点';

      // Completion %
      var compWrap=document.createElement('span');
      compWrap.className='project-completion-wrap';
      var compText=document.createElement('span');
      compText.className='project-completion-text';
      compText.textContent=completion+'%';
      var compBar=document.createElement('span');
      compBar.className='project-completion-bar';
      compBar.innerHTML='<span class="project-completion-fill" style="width:'+completion+'%"></span>';
      compWrap.appendChild(compText);compWrap.appendChild(compBar);

      var delBtn=document.createElement('button');
      delBtn.className='btn-icon btn-icon--danger';
      delBtn.title='删除项目';delBtn.dataset.action='delete-project';
      delBtn.dataset.pi=pi;delBtn.setAttribute('aria-label','删除项目');
      delBtn.innerHTML=ICON_TRASH;

      header.appendChild(swatch);header.appendChild(nameInput);header.appendChild(badge);header.appendChild(compWrap);header.appendChild(delBtn);
      card.appendChild(header);

      // timeline
      var timeline=document.createElement('div');
      timeline.className='timeline';

      if(project.nodes.length===0){
        var r=document.createElement('div');r.className='timeline-empty';
        r.textContent='暂无节点，点击右侧 + 按钮添加第一个里程碑';timeline.appendChild(r);
      }else{
        var row=document.createElement('div');row.className='timeline-row';
        project.nodes.forEach(function(node,ni){row.appendChild(buildNodeGroup(node,pi,ni,project.nodes.length))});
        var addBtn=document.createElement('button');
        addBtn.className='add-node-btn';addBtn.dataset.action='add-node';
        addBtn.dataset.pi=pi;addBtn.title='添加节点';
        addBtn.setAttribute('aria-label','添加节点');addBtn.innerHTML=ICON_PLUS;
        row.appendChild(addBtn);timeline.appendChild(row);
      }

      card.appendChild(timeline);projectsList.appendChild(card);
    });
  }

  function buildNodeGroup(node,pi,ni,total){
    var isFirst=ni===0,isLast=ni===total-1;
    var group=document.createElement('div');
    group.className='node-group'+(isFirst?' node-group--first':'')+(isLast?' node-group--last':'');

    var conn=document.createElement('div');
    conn.className='connector'+(node.done&&!node.failed?' done':'');group.appendChild(conn);

    var hitarea=document.createElement('div');hitarea.className='node-hitarea';

    var circle=document.createElement('button');
    circle.className='node-circle'+(node.failed?' failed':(node.done?' done':''));
    circle.dataset.action='toggle-node';circle.dataset.pi=pi;circle.dataset.ni=ni;
    circle.setAttribute('aria-label',node.failed?'已阻塞: '+(node.name||'节点'):(node.done?'已完成: ':'未完成: ')+(node.name||'节点'));

    var checkIcon=document.createElement('span');checkIcon.className='node-icon node-icon--check';checkIcon.innerHTML=ICON_CHECK;circle.appendChild(checkIcon);
    var crossIcon=document.createElement('span');crossIcon.className='node-icon node-icon--cross';crossIcon.innerHTML=ICON_CROSS;circle.appendChild(crossIcon);

    var ndBtn=document.createElement('button');
    ndBtn.className='node-delete-btn';ndBtn.dataset.action='delete-node';
    ndBtn.dataset.pi=pi;ndBtn.dataset.ni=ni;
    ndBtn.setAttribute('aria-label','删除节点');ndBtn.title='删除节点';ndBtn.textContent='×';

    hitarea.appendChild(circle);hitarea.appendChild(ndBtn);

    var label=document.createElement('input');
    label.type='text';label.className='node-label-input';
    label.value=node.name;label.placeholder='节点名称';
    label.dataset.action='rename-node';label.dataset.pi=pi;label.dataset.ni=ni;
    hitarea.appendChild(label);
    group.appendChild(hitarea);

    // Checklist
    if(node.checklist.length>0){
      var extras=document.createElement('div');extras.className='node-extras';
      var clWrap=document.createElement('div');
      if(node.clCollapsed)clWrap.classList.add('checklist-collapsed');

      var clHead=document.createElement('div');
      clHead.className='checklist-header';
      clHead.dataset.action='cl-toggle-visibility';clHead.dataset.pi=pi;clHead.dataset.ni=ni;
      clHead.style.cursor='pointer';clHead.title='点击收起/展开';

      var clArrow=document.createElement('span');clArrow.className='checklist-collapse-icon';clArrow.textContent='▾';
      var clTitle=document.createElement('span');
      var doneCL=node.checklist.filter(function(c){return c.done}).length;
      clTitle.textContent='📋 待办清单 ('+doneCL+'/'+node.checklist.length+')';
      clHead.appendChild(clArrow);clHead.appendChild(clTitle);clWrap.appendChild(clHead);

      var clItems=document.createElement('div');clItems.className='checklist-items';
      node.checklist.forEach(function(item,ci){
        var clItem=document.createElement('div');clItem.className='checklist-item'+(item.done?' done':'');

        var clCircle=document.createElement('button');
        clCircle.className='checklist-circle'+(item.done?' done':'');
        clCircle.dataset.action='toggle-checklist';clCircle.dataset.pi=pi;clCircle.dataset.ni=ni;clCircle.dataset.ci=ci;
        clCircle.title=item.done?'点击取消完成':'点击标记完成';
        var clCheck=document.createElement('span');clCheck.className='cl-check';
        clCheck.innerHTML='<svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
        clCircle.appendChild(clCheck);

        var clInput=document.createElement('input');
        clInput.type='text';clInput.className='checklist-item-input';
        clInput.value=item.name;clInput.placeholder='待办事项';
        clInput.dataset.action='rename-checklist';clInput.dataset.pi=pi;clInput.dataset.ni=ni;clInput.dataset.ci=ci;

        var clDel=document.createElement('button');
        clDel.className='btn-icon btn-icon--danger';clDel.style.cssText='width:20px;height:20px;';clDel.title='删除';
        clDel.dataset.action='delete-checklist';clDel.dataset.pi=pi;clDel.dataset.ni=ni;clDel.dataset.ci=ci;
        clDel.innerHTML='<svg width="10" height="10" viewBox="0 0 24 24" fill="none"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';

        clItem.appendChild(clCircle);clItem.appendChild(clInput);clItem.appendChild(clDel);clItems.appendChild(clItem);
      });

      var clAddBtn=document.createElement('button');
      clAddBtn.className='checklist-add-btn';clAddBtn.dataset.action='add-checklist-item';
      clAddBtn.dataset.pi=pi;clAddBtn.dataset.ni=ni;clAddBtn.textContent='+ 添加待办项';

      clWrap.appendChild(clItems);clWrap.appendChild(clAddBtn);extras.appendChild(clWrap);group.appendChild(extras);
    }
    return group;
  }

  // ===== Project Color Picker =====
  var prSwatch=null;
  function openPrColorPicker(pi,anchor){
    prColorTarget=pi;prSwatch=anchor;
    var rect=anchor.getBoundingClientRect();
    prColorPopover.innerHTML='';
    COLORS.forEach(function(c){
      var dot=document.createElement('span');dot.className='pr-color-dot';dot.style.background=c;
      if(c===projects[pi].color)dot.classList.add('selected');
      dot.onclick=function(e){e.stopPropagation();projects[prColorTarget].color=c;save();render();hidePrColor()};
      dot.addEventListener('mousedown',function(e){e.stopPropagation();e.preventDefault()});
      prColorPopover.appendChild(dot);
    });
    // Remove color button
    var remove=document.createElement('span');remove.className='pr-color-dot';remove.style.background='#e8e4dd';remove.textContent='✕';remove.style.display='flex';remove.style.alignItems='center';remove.style.justifyContent='center';remove.style.fontSize='14px';remove.style.color='var(--text-muted)';remove.title='移除颜色';
    remove.addEventListener('click',function(e){e.stopPropagation();projects[prColorTarget].color=null;save();render();hidePrColor();});
    prColorPopover.appendChild(remove);

    prColorPopover.style.left=Math.min(rect.left,window.innerWidth-230)+'px';
    prColorPopover.style.top=Math.max(8,Math.min(rect.bottom+6,window.innerHeight-300))+'px';
    prColorPopover.classList.add('visible');
  }
  function hidePrColor(){prColorPopover.classList.remove('visible');prColorTarget=null;prSwatch=null}
  // Close on outside click, but don't close on popover internals
  document.addEventListener('click',function(e){
    if(!prColorPopover.classList.contains('visible'))return;
    var insidePop=prColorPopover.contains(e.target);
    var onSwatch=e.target.closest('.project-color-swatch');
    if(!insidePop&&!onSwatch)hidePrColor();
  });

  // ===== Context Menu =====
  function showContextMenu(x,y,pi,ni){
    var node=projects[pi]&&projects[pi].nodes[ni];if(!node)return;
    ctxTarget={pi:pi,ni:ni};
    ctxMenu.style.left='0';ctxMenu.style.top='0';ctxMenu.classList.add('visible');
    var mw=ctxMenu.offsetWidth,mh=ctxMenu.offsetHeight;
    ctxMenu.style.left=Math.max(8,Math.min(x,window.innerWidth-mw-8))+'px';
    ctxMenu.style.top=Math.max(8,Math.min(y,window.innerHeight-mh-8))+'px';
    ctxMenu.querySelector('[data-menu-action="reset-state"]').style.display=(node.done||node.failed)?'flex':'none';
    if(node.checklist.length>0){menuToggleCL.style.display='flex';menuToggleCLLabel.textContent=node.clCollapsed?'展开待办清单':'收起待办清单'}else{menuToggleCL.style.display='none'}
  }
  function hideContextMenu(){ctxMenu.classList.remove('visible');ctxTarget=null}

  // ===== Actions =====
  function addProject(){projects.push({name:'新项目',color:rndC(),nodes:[{name:'步骤 1',done:false,failed:false,checklist:[],clCollapsed:false}]});save();render()}
  function deleteProject(pi){projects.splice(pi,1);save();render()}
  function addNode(pi){var p=projects[pi];if(!p)return;p.nodes.push({name:'步骤 '+(p.nodes.length+1),done:false,failed:false,checklist:[],clCollapsed:false});save();render()}
  function deleteNode(pi,ni){projects[pi].nodes.splice(ni,1);save();render()}
  function toggleNode(pi,ni){var n=projects[pi]&&projects[pi].nodes[ni];if(!n)return;if(n.failed){n.failed=false;n.done=false}else{n.done=!n.done}save();render()}
  function renameProject(pi,name){projects[pi].name=name;save()}
  function renameNode(pi,ni,name){var n=projects[pi]&&projects[pi].nodes[ni];if(n){n.name=name;save()}}
  function addChecklist(pi,ni){var n=projects[pi]&&projects[pi].nodes[ni];if(!n)return;n.checklist.push({name:'待办项',done:false});n.clCollapsed=false;save();render()}
  function addChecklistItem(pi,ni){var n=projects[pi]&&projects[pi].nodes[ni];if(!n)return;n.checklist.push({name:'待办项',done:false});save();render()}
  function toggleChecklist(pi,ni,ci){var item=projects[pi]&&projects[pi].nodes[ni]&&projects[pi].nodes[ni].checklist[ci];if(!item)return;item.done=!item.done;save();render()}
  function renameChecklist(pi,ni,ci,name){var item=projects[pi]&&projects[pi].nodes[ni]&&projects[pi].nodes[ni].checklist[ci];if(item)item.name=name;save()}
  function deleteChecklist(pi,ni,ci){projects[pi].nodes[ni].checklist.splice(ci,1);save();render()}
  function toggleChecklistCollapse(pi,ni){var n=projects[pi]&&projects[pi].nodes[ni];if(!n)return;n.clCollapsed=!n.clCollapsed;save();render()}
  function markFailed(pi,ni){var n=projects[pi]&&projects[pi].nodes[ni];if(!n)return;n.failed=true;n.done=false;save();render()}
  function resetNodeState(pi,ni){var n=projects[pi]&&projects[pi].nodes[ni];if(!n)return;n.failed=false;n.done=false;save();render()}

  // ===== Events =====
  document.addEventListener('click',function(e){
    if(!ctxMenu.contains(e.target))hideContextMenu();

    var target=e.target.closest('[data-action]'),action=target?target.dataset.action:null;
    if(!target){target=e.target.closest('[data-menu-action]');action=target?target.getAttribute('data-menu-action'):null}
    if(!target||!action)return;

    var pi=parseInt(target.dataset.pi,10),ni=target.dataset.ni!==undefined?parseInt(target.dataset.ni,10):undefined,ci=target.dataset.ci!==undefined?parseInt(target.dataset.ci,10):undefined;
    e.preventDefault();
    switch(action){
      case'add-project':addProject();break;
      case'delete-project':e.stopPropagation();if(confirm('确定要删除这个项目吗？此操作不可撤销。'))deleteProject(pi);break;
      case'add-node':addNode(pi);break;
      case'delete-node':deleteNode(pi,ni);break;
      case'toggle-node':e.stopPropagation();toggleNode(pi,ni);break;
      case'toggle-checklist':toggleChecklist(pi,ni,ci);break;
      case'add-checklist-item':addChecklistItem(pi,ni);break;
      case'delete-checklist':deleteChecklist(pi,ni,ci);break;
      case'checklist':{var t=ctxTarget;hideContextMenu();if(t)addChecklist(t.pi,t.ni);break}
      case'cl-toggle-visibility':{var cT=ctxTarget;toggleChecklistCollapse(cT?cT.pi:pi,cT?cT.ni:ni);hideContextMenu();break}
      case'fail':{var t=ctxTarget;hideContextMenu();if(t)markFailed(t.pi,t.ni);break}
      case'reset-state':{var t=ctxTarget;hideContextMenu();if(t)resetNodeState(t.pi,t.ni);break}
    }
  });

  document.addEventListener('contextmenu',function(e){
    var circle=e.target.closest('.node-circle');
    if(!circle){hideContextMenu();return}
    e.preventDefault();
    showContextMenu(e.clientX,e.clientY,parseInt(circle.dataset.pi,10),parseInt(circle.dataset.ni,10));
  });

  document.addEventListener('input',function(e){
    var t=e.target,action=t.dataset.action;if(!action)return;
    var pi=parseInt(t.dataset.pi,10),ni=t.dataset.ni!==undefined?parseInt(t.dataset.ni,10):undefined,ci=t.dataset.ci!==undefined?parseInt(t.dataset.ci,10):undefined;
    switch(action){case'rename-project':renameProject(pi,t.value);break;case'rename-node':renameNode(pi,ni,t.value);break;case'rename-checklist':renameChecklist(pi,ni,ci,t.value);break}
  });

  btnAddProject.addEventListener('click',addProject);

  load();save();render();
})();
</script>
</body>
</html>
