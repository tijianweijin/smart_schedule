-weight:600}\n.android-choice-list,.android-time-list{scrollbar-width:thin;scrollbar-color:var(--border) transparent}\n.android-choice-list::-webkit-scrollbar,.android-time-list::-webkit-scrollbar{width:4px}\n.android-choice-list::-webkit-scrollbar-thumb,.android-time-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}\n.android-date-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}\n.android-date-head strong{font-size:16px;color:var(--text);font-weight:600}\n.android-date-nav{width:44px;height:44px;border:0;background:var(--surface-soft);border-radius:8px;color:var(--primary);font-size:24px}\n.android-date-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}\n.android-date-weekday{padding:5px 0;text-align:center;font-size:12px;color:var(--text-2)}\n.android-date-day{min-width:0;width:100%;height:42px;border:0;border-radius:7px;background:transparent;color:var(--text);font-size:16px;font-variant-numeric:tabular-nums}\n.android-date-day.is-today{background:var(--primary-soft);color:var(--primary)}\n.android-date-day[aria-pressed=\"true\"]{background:var(--primary);color:var(--surface)}\n.android-date-day:disabled{color:var(--muted);opacity:.4}\n@media(max-width:380px){.daystart-group .ketime-control-trigger{height:32px;min-height:32px;padding-top:3px;padding-bottom:3px}}\n#view-settings .important-days-settings{margin:0;padding:0;border:0}\n.untimed-head #add-untimed-todo{width:34px;min-width:34px;height:34px;padding:0;font-size:23px;line-height:1;font-weight:400}\n.schedule-grid{grid-template-columns:var(--android-time-width) repeat(21,var(--android-day-width));width:calc(var(--android-time-width) + 21 * var(--android-day-width));min-width:0;overflow-anchor:none}\n.schedule-wrap{scroll-padding-left:var(--android-time-width)}\n.untimed-scroll{padding:8px 10px 12px}\n.untimed-list{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}\n.untimed-list .untimed-item{height:auto;min-height:64px;grid-template-columns:26px minmax(0,1fr) 24px;align-items:start;gap:2px 4px;padding:5px 2px;background:var(--surface);border:1px solid var(--border);border-radius:7px}\n.untimed-item .untimed-toggle{grid-column:1;grid-row:1;margin-top:3px}\n.untimed-item .untimed-name,.untimed-item .untimed-edit-input{grid-column:2;grid-row:1;white-space:normal;overflow-wrap:anywhere;text-overflow:clip;font-size:.76rem;line-height:1.5;padding:2px 0}\n.untimed-item .untimed-delete{grid-column:3;grid-row:1;width:24px;opacity:1}\n.untimed-item .inbox-organize{grid-column:2 / 4;grid-row:2;justify-self:start;min-height:28px;padding:2px 0}\n.untimed-item .homework-due{white-space:normal;font-size:11px;line-height:1.5}\n.event-block,.event-block.has-conflict{padding:4px 4px 26px 5px}\n  .event-block.event-compact:not(.event-marker){padding:3px 28px 3px 5px}\n  .event-block .event-title{white-space:pre-wrap;overflow-wrap:anywhere;text-overflow:clip;line-height:1.3}\n  .event-block .event-time,.event-block .event-link,.event-block .event-source{white-space:pre-wrap;overflow-wrap:anywhere;text-overflow:clip;line-height:1.3}\n.event-block .event-check,.event-block.has-conflict .event-check{top:auto;bottom:3px;right:4px;width:20px;height:20px;transform:none}\n.event-block .event-check:hover,.event-block.has-conflict .event-check:hover{transform:scale(1.08)}\n.event-block.event-marker{padding:4px 25px 0 4px}\n.event-block.event-marker.marker-end-only{padding:0 25px 4px 4px}\n.event-block.event-marker .event-check{top:auto;bottom:3px;right:3px;width:14px;height:14px;font-size:10px;transform:none}\n.event-block.event-marker.marker-start-only{padding:4px 3px 0}\n.event-block.event-marker.marker-start-only .event-check{position:relative;top:auto;bottom:auto;right:auto;align-self:flex-end;flex:0 0 14px;margin-top:3px}\n\n/* Only the calendar popup marks the date under the viewport's center line. */\n.calendar-day.today:not(.android-calendar-selected),.calendar-day.today:not(.android-calendar-selected):hover{background:var(--primary-soft);color:var(--primary)}\n.calendar-day.android-calendar-selected,.calendar-day.android-calendar-selected:hover{background:var(--primary);color:#fff}\n\n/* Compact project timelines: three node slots per phone viewport. */\n.project-app,.growth-app{padding:18px 12px 24px}\n.project-header-main,.growth-header-main{gap:10px;padding-bottom:14px;margin-bottom:10px}\n.project-title,.growth-title{font-size:1.4rem;line-height:1.25}\n.project-header-main .btn{padding:7px 10px;font-size:.8rem}\n.project-rule-note{font-size:12px;line-height:1.6;margin-bottom:14px;color:var(--text-2)}\n.projects-list{gap:14px}\n.project-card{padding:12px 10px;border-radius:10px;box-shadow:none}\n.project-card-head{display:grid;grid-template-columns:18px minmax(0,1fr) 86px 24px;gap:7px;margin-bottom:16px;align-items:center}\n.project-color{grid-column:1;grid-row:1;width:16px;height:16px}\n.project-name{grid-column:2 / 4;grid-row:1;min-width:0;width:100%;font-size:16px}\n.delete-project{grid-column:4;grid-row:1;padding:3px;min-height:28px}\n.project-badge{grid-column:1 / 3;grid-row:2;justify-self:start;font-size:11px;padding:3px 7px}\n.completion{grid-column:3 / 5;grid-row:2;justify-self:end;font-size:12px;gap:5px}\n.completion-bar{width:48px;height:4px}\n.timeline{padding:4px 0 8px;scrollbar-width:thin;scrollbar-color:var(--track) transparent}\n.timeline-row{position:relative;padding-inline:var(--android-node-width,105px)}\n.node-group{width:var(--android-node-width,105px);flex:0 0 var(--android-node-width,105px)}\n.node-hitarea{gap:6px}\n.node-circle{width:40px;height:40px;border-width:2px}\n.connector{top:19px;height:2px}\n.node-label{width:calc(100% - 10px);font-size:12px!important;padding:4px 1px;min-height:30px}\n.node-delete{right:calc(50% - 32px);top:-3px;width:20px;height:20px}\n.android-current-node .node-circle:not(.failed){border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-soft)}\n.node-extras{width:calc(100% - 8px);margin-top:7px;padding-left:6px;border-left-width:1px}\n.checklist-header{font-size:11px;gap:3px;line-height:1.4;overflow-wrap:anywhere}\n.node-extras .task-row{grid-template-columns:22px minmax(0,1fr) 22px;gap:2px 3px;align-items:start}\n.task-row .task-toggle{grid-column:1;grid-row:1;min-width:20px;min-height:20px;width:20px;height:20px;margin-top:2px}\n.task-main{grid-column:2 / 4;grid-row:1}\n.task-name{font-size:12px!important;line-height:1.5;min-height:24px}\n.task-meta{font-size:11px;white-space:normal;overflow-wrap:anywhere;line-height:1.4}\n.task-edit{grid-column:2;grid-row:2;justify-self:start}\n.task-delete{grid-column:3;grid-row:2}\n.add-task{font-size:11px;text-align:left;line-height:1.5}\n.add-node{flex:0 0 32px;width:32px;height:32px;margin:4px 8px 0 2px}\n\n/* Render the growth chart at its real width, not a shrunken 960px canvas. */\n.growth-controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));width:100%;gap:8px}\n.growth-date-label{font-size:12px;min-width:0;gap:4px}\n.growth-date-input{width:100%;min-width:0;padding:7px 8px}\n.growth-note{font-size:12px;line-height:1.6;color:var(--text-2);margin:8px 0 14px}\n.growth-card{border-radius:10px;box-shadow:none}\n.growth-legend{padding:10px 12px;min-height:44px;gap:6px 12px}\n.growth-legend-item{font-size:12px;flex-wrap:wrap;gap:5px}\n.growth-legend-name{max-width:180px}.growth-legend-status{font-size:11px}\n.growth-chart-scroll{overflow:visible}\n.growth-chart-stage{min-width:0;width:100%;height:300px}\n.growth-svg{width:100%;height:100%}\n.growth-axis-label{font-size:12px;fill:var(--text-2)}\n.growth-tooltip{max-width:calc(100% - 16px);white-space:normal;overflow-wrap:anywhere;transform:none;font-size:12px}\n.growth-empty{font-size:12px;text-align:center;padding:20px}\n@media(max-height:650px){.growth-chart-stage{height:240px}}\n@media(prefers-reduced-motion:reduce){.project-card{animation:none}.completion-fill{transition:none}}\n\n\u003c/style>\u003c/head>\n\u003cbody>\n\u003cheader class=\"app-nav\">\n  \u003cdiv class=\"brand\">\u003cspan class=\"brand-copy\">\u003cspan class=\"brand-cn\">刻时\u003c/span>\u003c/span>\u003c/div>\n  \u003cnav class=\"view-tabs\" aria-label=\"主要页面\">\n    \u003cbutton class=\"view-tab active\" data-view=\"schedule\">日程表\u003c/button>\n    \u003cbutton class=\"view-tab\" data-view=\"projects\">项目单\u003c/button>\n    \u003cbutton class=\"view-tab\" data-view=\"growth\">成长曲线\u003c/button>\n  \u003c/nav>\n  \u003cbutton id=\"settings-btn\" class=\"settings-btn\" type=\"button\" aria-label=\"设置\" title=\"设置\">\u003csvg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" aria-hidden=\"true\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\">\u003cpath d=\"M9 3h6l.5 3 2 1.2 2.8-1 3 5.2-2.3 2v2.4l2.3 2-3 5.2-2.8-1-2 1.2-.5 3H9l-.5-3-2-1.2-2.8 1-3-5.2 2.3-2v-2.4l-2.3-2 3-5.2 2.8 1 2-1.2z\" transform=\"translate(2 0) scale(.83)\"/>\u003ccircle cx=\"12\" cy=\"12\" r=\"3.5\"/>\u003c/svg>\u003c/button>\n\u003c/header>\n\n\u003cmain>\n  \u003csection class=\"view active\" id=\"view-schedule\" aria-label=\"日程表\">\n    \u003cdiv class=\"schedule-toolbar\">\n      \u003cbutton class=\"date-picker-btn\" id=\"date-picker-btn\">\u003cspan class=\"calendar-icon\">▣\u003c/span>\u003cspan id=\"week-range-label\">\u003c/span>\u003c/button>\n      \u003cbutton class=\"today-btn\" id=\"today-btn\">今天\u003c/button>\n      \u003cdiv class=\"week-nav\">\u003cbutton class=\"icon-btn\" id=\"prev-week\" aria-label=\"上一周\">‹\u003c/button>\u003cbutton class=\"icon-btn\" id=\"next-week\" aria-label=\"下一周\">›\u003c/button>\u003c/div>\n      \u003cdiv class=\"calendar-popup\" id=\"calendar-popup\">\n        \u003cdiv class=\"calendar-head\">\u003cbutton id=\"cal-prev-month\" aria-label=\"上个月\">‹\u003c/button>\u003cspan class=\"calendar-month\" id=\"cal-month-label\">\u003c/span>\u003cbutton id=\"cal-next-month\" aria-label=\"下个月\">›\u003c/button>\u003c/div>\n        \u003cdiv class=\"calendar-weekdays\">\u003cspan>一\u003c/span>\u003cspan>二\u003c/span>\u003cspan>三\u003c/span>\u003cspan>四\u003c/span>\u003cspan>五\u003c/span>\u003cspan>六\u003c/span>\u003cspan>日\u003c/span>\u003c/div>\n        \u003cdiv class=\"calendar-days\" id=\"calendar-days\">\u003c/div>\n      \u003c/div>\n      \u003cspan id=\"sync-status\" class=\"sync-status\" role=\"status\" aria-live=\"polite\">\u003c/span>\n      \u003cdiv class=\"toolbar-spacer\">\u003c/div>\n      \u003clabel class=\"daystart-group\">\u003cspan>日起始\u003c/span>\u003cselect class=\"daystart-select\" id=\"daystart-select\" aria-label=\"一天的开始时间\">\u003c/select>\u003c/label>\n      \u003cbutton class=\"btn school-toolbar-btn\" id=\"holiday-btn\" type=\"button\">节假日\u003c/button>\n      \u003cbutton class=\"btn bupt-sync-btn\" id=\"bupt-sync-btn\" type=\"button\">导入课表\u003c/button>\n      \u003cbutton class=\"btn\" id=\"schedule-assistant-btn\" type=\"button\" style=\"background:#fff;color:var(--primary);border-color:var(--primary)\">日程助手\u003c/button>\n      \u003cbutton class=\"add-event-btn\" id=\"add-event-btn\">\u003cspan>＋\u003c/span>\u003cspan class=\"label\">添加日程\u003c/span>\u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"schedule-wrap\" id=\"schedule-wrap\">\u003cdiv class=\"schedule-grid\" id=\"schedule-grid\">\u003c/div>\u003c/div>\n    \u003csection class=\"untimed-panel\" aria-labelledby=\"untimed-title\">\n      \u003cdiv class=\"untimed-head\">\n        \u003ch2 class=\"untimed-title\" id=\"untimed-title\">待收纳\u003c/h2>\n        \u003cspan class=\"untimed-count\" id=\"untimed-count\">0 项\u003c/span>\n        \u003cspan class=\"untimed-spacer\">\u003c/span>\n        \u003cbutton class=\"btn school-toolbar-btn\" id=\"ucloud-btn\" type=\"button\">导入作业\u003c/button>\n        \u003cbutton class=\"untimed-add-btn\" id=\"add-untimed-todo\" type=\"button\">＋ 快速记录\u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"untimed-scroll\">\n        \u003cdiv class=\"untimed-add-row\" id=\"untimed-add-row\">\n          \u003cspan class=\"untimed-add-mark\" aria-hidden=\"true\">\u003c/span>\n          \u003cinput class=\"untimed-input\" id=\"untimed-input\" maxlength=\"200\" autocomplete=\"off\" placeholder=\"记录尚未整理的事情\" aria-label=\"新待收纳事项名称\">\n        \u003c/div>\n        \u003cdiv class=\"untimed-list\" id=\"untimed-list\" aria-live=\"polite\">\u003c/div>\n        \u003cdiv class=\"untimed-empty\" id=\"untimed-empty\">暂时没有待收纳事项。先快速记录，之后再安排进日程或项目。\u003c/div>\n      \u003c/div>\n    \u003c/section>\n  \u003c/section>\n\n  \u003csection class=\"view\" id=\"view-projects\" aria-label=\"项目单\">\n    \u003cdiv class=\"project-app\">\n      \u003cdiv class=\"project-header-main\">\n        \u003cdiv class=\"project-title-wrap\">\u003ch1 class=\"project-title\">项目进度追踪\u003c/h1>\u003c/div>\n        \u003cbutton class=\"btn btn-primary\" id=\"btn-add-project\">＋ 新建项目\u003c/button>\n      \u003c/div>\n      \u003cp class=\"project-rule-note\">完成度按项目全部待办及空节点里程碑计算；阻塞事项仍计入，无期限重复日程不计入。\u003c/p>\n      \u003cdiv class=\"projects-list\" id=\"projects-list\">\u003c/div>\n      \u003cdiv class=\"empty-state\" id=\"empty-state\">\u003cdiv class=\"empty-state-icon\">◎\u003c/div>\u003ch3>还没有项目\u003c/h3>\u003cp>新建项目，并用节点与待办细则推进长期目标。\u003c/p>\u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"view\" id=\"view-growth\" aria-label=\"成长曲线\">\n    \u003cdiv class=\"growth-app\">\n      \u003cdiv class=\"growth-header-main\">\n        \u003ch1 class=\"growth-title\">成长曲线\u003c/h1>\n        \u003cdiv class=\"growth-controls\" aria-label=\"成长曲线日期范围\">\n          \u003clabel class=\"growth-date-label\" for=\"growth-start\">开始日期\u003cinput class=\"growth-date-input\" type=\"date\" id=\"growth-start\">\u003c/label>\n          \u003clabel class=\"growth-date-label\" for=\"growth-end\">结束日期\u003cinput class=\"growth-date-input\" type=\"date\" id=\"growth-end\">\u003c/label>\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"growth-card\">\n        \u003cdiv class=\"growth-legend\" id=\"growth-legend\">\u003c/div>\n        \u003cdiv class=\"growth-chart-scroll\" id=\"growth-chart-scroll\">\n          \u003cdiv class=\"growth-chart-stage\" id=\"growth-chart-stage\">\n            \u003csvg class=\"growth-svg\" id=\"growth-svg\" viewBox=\"0 0 960 430\" role=\"img\" aria-label=\"项目完成度成长曲线\">\u003c/svg>\n            \u003cdiv class=\"growth-tooltip\" id=\"growth-tooltip\" role=\"status\" aria-live=\"polite\">\u003c/div>\n            \u003cdiv class=\"growth-empty\" id=\"growth-empty\">\u003cstrong>当前范围没有成长记录\u003c/strong>\u003cspan>调整起止日期，或先在项目单中推进项目。\u003c/span>\u003c/div>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\u003c/main>\n\n\u003cdiv class=\"context-menu\" id=\"context-menu\">\n  \u003cbutton class=\"context-menu-item\" data-menu-action=\"checklist\">添加待办清单\u003c/button>\n  \u003cbutton class=\"context-menu-item\" data-menu-action=\"cl-toggle\" id=\"menu-toggle-checklist\" style=\"display:none\">\u003cspan id=\"menu-toggle-checklist-label\">收起待办清单\u003c/span>\u003c/button>\n  \u003cdiv class=\"context-menu-divider\">\u003c/div>\n  \u003cbutton class=\"context-menu-item danger\" data-menu-action=\"fail\">标记为阻塞\u003c/button>\n  \u003cbutton class=\"context-menu-item\" data-menu-action=\"reset\" id=\"menu-reset\" style=\"display:none\">重置为未完成\u003c/button>\n\u003c/div>\n\u003cdiv class=\"project-color-popover\" id=\"project-color-popover\">\u003c/div>\n\n\u003cdiv class=\"overlay\" id=\"choice-overlay\">\n  \u003cdiv class=\"modal small\">\u003cdiv class=\"modal-title\">修改日程\u003c/div>\u003cp class=\"choice-copy\" id=\"choice-desc\">\u003c/p>\u003cdiv class=\"choice-buttons\">\u003cbutton class=\"btn\" id=\"choice-single\">仅修改本次\u003c/button>\u003cbutton class=\"btn btn-primary\" id=\"choice-all\">修改全部相关\u003c/button>\u003cbutton class=\"btn\" id=\"choice-cancel\">取消\u003c/button>\u003c/div>\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"overlay\" id=\"schedule-overlay\">\n  \u003cdiv class=\"modal\">\n    \u003cdiv class=\"modal-title\"
