ype=\"button\" style=\"background:#fff;color:var(--primary);border-color:var(--primary)\">日程助手\u003c/button>\n      \u003cbutton class=\"add-event-btn\" id=\"add-event-btn\">\u003cspan>＋\u003c/span>\u003cspan class=\"label\">添加日程\u003c/span>\u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"schedule-wrap\" id=\"schedule-wrap\">\u003cdiv class=\"schedule-grid\" id=\"schedule-grid\">\u003c/div>\u003c/div>\n    \u003csection class=\"untimed-panel\" aria-labelledby=\"untimed-title\">\n      \u003cdiv class=\"untimed-head\">\n        \u003ch2 class=\"untimed-title\" id=\"untimed-title\">待收纳\u003c/h2>\n        \u003cspan class=\"untimed-count\" id=\"untimed-count\">0 项\u003c/span>\n        \u003cspan class=\"untimed-spacer\">\u003c/span>\n        \u003cbutton class=\"btn school-toolbar-btn\" id=\"ucloud-btn\" type=\"button\">导入作业\u003c/button>\n        \u003cbutton class=\"untimed-add-btn\" id=\"add-untimed-todo\" type=\"button\">＋ 快速记录\u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"untimed-scroll\">\n        \u003cdiv class=\"untimed-add-row\" id=\"untimed-add-row\">\n          \u003cspan class=\"untimed-add-mark\" aria-hidden=\"true\">\u003c/span>\n          \u003cinput class=\"untimed-input\" id=\"untimed-input\" maxlength=\"200\" autocomplete=\"off\" placeholder=\"记录尚未整理的事情，按 Enter 保存\" aria-label=\"新待收纳事项名称\">\n          \u003cspan class=\"untimed-add-hint\">Enter\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"untimed-list\" id=\"untimed-list\" aria-live=\"polite\">\u003c/div>\n        \u003cdiv class=\"untimed-empty\" id=\"untimed-empty\">暂时没有待收纳事项。先快速记录，之后再安排进日程或项目。\u003c/div>\n      \u003c/div>\n    \u003c/section>\n  \u003c/section>\n\n  \u003csection class=\"view\" id=\"view-projects\" aria-label=\"项目单\">\n    \u003cdiv class=\"project-app\">\n      \u003cdiv class=\"project-header-main\">\n        \u003cdiv class=\"project-title-wrap\">\u003ch1 class=\"project-title\">项目进度追踪\u003c/h1>\u003c/div>\n        \u003cbutton class=\"btn btn-primary\" id=\"btn-add-project\">＋ 新建项目\u003c/button>\n      \u003c/div>\n      \u003cp class=\"project-rule-note\">完成度按项目全部待办及空节点里程碑计算；阻塞事项仍计入，无期限重复日程不计入。\u003c/p>\n      \u003cdiv class=\"projects-list\" id=\"projects-list\">\u003c/div>\n      \u003cdiv class=\"empty-state\" id=\"empty-state\">\u003cdiv class=\"empty-state-icon\">◎\u003c/div>\u003ch3>还没有项目\u003c/h3>\u003cp>新建项目，并用节点与待办细则推进长期目标。\u003c/p>\u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"view\" id=\"view-growth\" aria-label=\"成长曲线\">\n    \u003cdiv class=\"growth-app\">\n      \u003cdiv class=\"growth-header-main\">\n        \u003ch1 class=\"growth-title\">成长曲线\u003c/h1>\n        \u003cdiv class=\"growth-controls\" aria-label=\"成长曲线日期范围\">\n          \u003clabel class=\"growth-date-label\" for=\"growth-start\">开始日期\u003cinput class=\"growth-date-input\" type=\"date\" id=\"growth-start\">\u003c/label>\n          \u003clabel class=\"growth-date-label\" for=\"growth-end\">结束日期\u003cinput class=\"growth-date-input\" type=\"date\" id=\"growth-end\">\u003c/label>\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"growth-card\">\n        \u003cdiv class=\"growth-legend\" id=\"growth-legend\">\u003c/div>\n        \u003cdiv class=\"growth-chart-scroll\" id=\"growth-chart-scroll\">\n          \u003cdiv class=\"growth-chart-stage\" id=\"growth-chart-stage\">\n            \u003csvg class=\"growth-svg\" id=\"growth-svg\" viewBox=\"0 0 960 430\" role=\"img\" aria-label=\"项目完成度成长曲线\">\u003c/svg>\n            \u003cdiv class=\"growth-tooltip\" id=\"growth-tooltip\" role=\"status\" aria-live=\"polite\">\u003c/div>\n            \u003cdiv class=\"growth-empty\" id=\"growth-empty\">\u003cstrong>当前范围没有成长记录\u003c/strong>\u003cspan>调整起止日期，或先在项目单中推进项目。\u003c/span>\u003c/div>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\u003c/main>\n\n\u003cdiv class=\"context-menu\" id=\"context-menu\">\n  \u003cbutton class=\"context-menu-item\" data-menu-action=\"checklist\">添加待办清单\u003c/button>\n  \u003cbutton class=\"context-menu-item\" data-menu-action=\"cl-toggle\" id=\"menu-toggle-checklist\" style=\"display:none\">\u003cspan id=\"menu-toggle-checklist-label\">收起待办清单\u003c/span>\u003c/button>\n  \u003cdiv class=\"context-menu-divider\">\u003c/div>\n  \u003cbutton class=\"context-menu-item danger\" data-menu-action=\"fail\">标记为阻塞\u003c/button>\n  \u003cbutton class=\"context-menu-item\" data-menu-action=\"reset\" id=\"menu-reset\" style=\"display:none\">重置为未完成\u003c/button>\n\u003c/div>\n\u003cdiv class=\"project-color-popover\" id=\"project-color-popover\">\u003c/div>\n\n\u003cdiv class=\"overlay\" id=\"choice-overlay\">\n  \u003cdiv class=\"modal small\">\u003cdiv class=\"modal-title\">修改日程\u003c/div>\u003cp class=\"choice-copy\" id=\"choice-desc\">\u003c/p>\u003cdiv class=\"choice-buttons\">\u003cbutton class=\"btn\" id=\"choice-single\">仅修改本次\u003c/button>\u003cbutton class=\"btn btn-primary\" id=\"choice-all\">修改全部相关\u003c/button>\u003cbutton class=\"btn\" id=\"choice-cancel\">取消\u003c/button>\u003c/div>\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"overlay\" id=\"schedule-overlay\">\n  \u003cdiv class=\"modal\">\n    \u003cdiv class=\"modal-title\" id=\"schedule-modal-title\">添加日程\u003c/div>\n    \u003cdiv class=\"form-group\">\u003clabel class=\"form-label\">日程名称\u003c/label>\u003cdiv class=\"form-hint\">先把光标放到名称中的任意位置，再插入数字占位符；可在一个名称中插入多个\u003c/div>\u003cdiv class=\"chips-editor\" id=\"chips-editor\">\u003c/div>\u003c/div>\n    \u003cdiv class=\"form-row\">\n      \u003cdiv class=\"form-group\">\u003clabel class=\"form-label\" for=\"event-project\">关联项目\u003c/label>\u003cselect class=\"form-select\" id=\"event-project\">\u003c/select>\u003c/div>\n      \u003cdiv class=\"form-group conditional\" id=\"event-node-group\">\u003clabel class=\"form-label\" for=\"event-node\">关联节点\u003c/label>\u003cselect class=\"form-select\" id=\"event-node\">\u003c/select>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"link-summary conditional\" id=\"event-link-summary\">\u003c/div>\n    \u003cdiv class=\"form-row three\">\n      \u003cdiv class=\"form-group\">\u003clabel class=\"form-label\" for=\"event-date\">日期\u003c/label>\u003cinput class=\"form-input\" type=\"date\" id=\"event-date\">\u003c/div>\n      \u003cdiv class=\"form-group\">\u003clabel class=\"form-label\" for=\"event-start\">开始（可不填）\u003cbutton class=\"time-clear\" type=\"button\" data-clear-time=\"event-start\" aria-label=\"清空开始时间\">清空\u003c/button>\u003c/label>\u003cinput class=\"form-input\" type=\"time\" id=\"event-start\" step=\"900\">\u003c/div>\n      \u003cdiv class=\"form-group\">\u003clabel class=\"form-label\" for=\"event-end\">结束（可不填）\u003cbutton class=\"time-clear\" type=\"button\" data-clear-time=\"event-end\" aria-label=\"清空结束时间\">清空\u003c/button>\u003c/label>\u003cinput class=\"form-input\" type=\"time\" id=\"event-end\" step=\"900\">\u003c/div>\n    \u003c/div>\n    \u003cp class=\"form-hint\">结束时间留空为无尾日程；开始时间留空为无头日程。至少填写一个时间。\u003c/p>\n    \u003cdiv class=\"form-row\">\n      \u003cdiv class=\"form-group\">\u003clabel class=\"form-label\" for=\"event-repeat\">重复\u003c/label>\u003cselect class=\"form-select\" id=\"event-repeat\">\u003coption value=\"none\">不重复\u003c/option>\u003coption value=\"daily\">每天\u003c/option>\u003coption value=\"weekly\">每周\u003c/option>\u003coption value=\"monthly\">每月\u003c/option>\u003c/select>\u003c/div>\n      \u003cdiv class=\"form-group\">\u003clabel class=\"form-label\">状态\u003c/label>\u003clabel class=\"check-line\">\u003cinput type=\"checkbox\" id=\"event-done\"> \u003cspan id=\"event-done-copy\">已完成（与关联待办同步）\u003c/span>\u003c/label>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"form-group conditional\" id=\"event-repeat-options\">\n      \u003clabel class=\"form-label\" for=\"event-repeat-limit\">重复期限与项目完成度\u003c/label>\n      \u003cdiv class=\"form-row\">\n        \u003cselect class=\"form-select\" id=\"event-repeat-limit\">\u003coption value=\"unbounded\">持续进行（不计项目完成度）\u003c/option>\u003coption value=\"bounded\">设置执行期限（按发生次数计入）\u003c/option>\u003c/select>\n        \u003cdiv class=\"conditional\" id=\"event-repeat-end-group\">\u003cinput class=\"form-input\" type=\"date\" id=\"event-repeat-end\" aria-label=\"重复结束日期\">\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"form-hint\">起始日期使用上方日期；有期限时，每次实际发生均作为一个任务单位。\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"form-group\">\u003clabel class=\"form-label\" for=\"event-location\">地点（可选）\u003c/label>\u003cinput class=\"form-input\" id=\"event-location\" maxlength=\"300\" placeholder=\"例如：图书馆三层\">\u003c/div>\n    \u003cdiv class=\"form-group\">\u003clabel class=\"form-label\" for=\"event-notes\">备注（可选）\u003c/label>\u003ctextarea class=\"form-input\" id=\"event-notes\" maxlength=\"2000\" rows=\"2\" style=\"resize:vertical\">\u003c/textarea>\u003c/div>\n    \u003cdiv class=\"form-group\">\u003clabel class=\"form-label\">颜色\u003c/label>\u003cdiv class=\"color-presets\" id=\"event-color-presets\">\u003c/div>\u003c/div>\n    \u003cdiv class=\"modal-actions\">\u003cbutton class=\"btn btn-danger left\" id=\"delete-event\" style=\"display:none\">删除日程\u003c/button>\u003cbutton class=\"btn\" id=\"cancel-event\">取消\u003c/button>\u003cbutton class=\"btn btn-primary\" id=\"save-event\">保存\u003c/button>\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"ph-config\" id=\"ph-config\">\n  \u003cdiv class=\"form-row\">\u003cdiv>\u003clabel class=\"form-label\">从\u003c/label>\u003cinput class=\"form-input\" type=\"number\" id=\"ph-from\" min=\"1\" max=\"150\">\u003c/div>\u003cdiv>\u003clabel class=\"form-label\">至\u003c/label>\u003cinput class=\"form-input\" type=\"number\" id=\"ph-to\" min=\"1\" max=\"150\">\u003c/div>\u003c/div>\n  \u003cdiv class=\"form-row\" style=\"margin-top:8px\">\u003cdiv>\u003clabel class=\"form-label\">筛选\u003c/label>\u003cselect class=\"form-select\" id=\"ph-filter\">\u003coption value=\"all\">全部\u003c/option>\u003coption value=\"odd\">仅奇数
